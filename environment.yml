# =============================================================================
# Saturn pre-configured conda environment
# =============================================================================
# This file is a direct export of the exact `saturn` environment used to run
# the experiments reported in the paper. It is provided so the environment can
# be recreated in a single command, without manually following `setup.sh`:
#
#     conda env create -f environment.yml
#     conda activate saturn
#
# Notes
# -----
# * The PyTorch wheels are the CUDA 11.3 builds (`+cu113`). The extra pip index
#   below points pip at the official PyTorch download server so these wheels
#   resolve automatically. A CUDA-enabled GPU with a driver compatible with
#   CUDA 11.3 is required for GPU execution (CPU-only also works, but is slow).
# * These pins reflect the environment that was actually used and tested, so a
#   few versions differ from `setup.sh` (e.g. `transformers`, `triton`); the
#   pins here take precedence.
# * See the "System requirements" section of the README for the operating
#   systems and hardware this environment was validated on.
# =============================================================================
name: saturn
channels:
  - conda-forge
  - defaults
dependencies:
